# CI: en cada push se ejecutan los tests. Si fallan o la cobertura baja del 80 %, el check sale en rojo.
# Para BLOQUEAR el merge: GitHub → Settings → Branches → proteger `main` y exigir este check.
name: CI
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: sportryn, POSTGRES_PASSWORD: sportryn, POSTGRES_DB: sportryn_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sportryn" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sportryn:sportryn@localhost:5432/sportryn_test
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run generate
